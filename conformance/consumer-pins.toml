schema_version = 1
package = "ores-config-discovery"
package_version = "0.2.2"
# This is the reviewed code-authority commit from #7. Later main commits may be
# documentation-only and must not cause consumer pin churn.
code_authority_revision = "1ffd94663a110f77fcd5e1143fd10f89b1f284e0"

[[consumer]]
repository = "ORESoftware/ores-compose"
manifest_path = "Cargo.toml"
lockfile_path = ""
default_features = false
lock_policy = "none"
notes = "Compose owns its warning path; repository does not track Cargo.lock."

[[consumer]]
repository = "opto-sync/opto-sync-lib-core"
manifest_path = "Cargo.toml"
lockfile_path = ""
default_features = false
lock_policy = "none"
notes = "Opto owns strict non-regular/root-placement policy and delegates traversal to Search."

[[consumer]]
repository = "ores-rate-limit/ores-rl-lib-core"
manifest_path = "Cargo.toml"
lockfile_path = ""
default_features = false
lock_policy = "none"
notes = "Dependency is optional behind config-toml; default Rust 1.78 graph stays telemetry-free."

[[consumer]]
repository = "ores-redis-lru-cache/ores-lru-redis.rs"
manifest_path = "Cargo.toml"
lockfile_path = "Cargo.lock"
default_features = false
lock_policy = "cargo-generated"
notes = "Rust 1.85 consumer; lockfile refresh must be generated by Cargo, never hand-edited."

[[consumer]]
repository = "ores-otel/ores.otel.log"
manifest_path = "sdk/rust/Cargo.toml"
lockfile_path = "Cargo.lock"
default_features = false
lock_policy = "cargo-generated"
notes = "Traversal-only dependency; default-features=false prevents the logging SDK from depending on itself through otel-warning."
