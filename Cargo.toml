[package]
name = "ores-config-discovery"
version = "0.2.1"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Finds the nearest fleet config file by walking up from the working directory, and reports when it is not at a repository root"
repository = "https://github.com/ORESoftware/ores-config-discovery"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[features]
# Keep the default graph compatible with the crate's declared Rust 1.78 MSRV.
# Consumers that want structured OTel warning emission opt in explicitly; the
# logger currently requires Rust 1.88. Without it, warnings fall back to stderr.
default = []
otel-warning = ["dep:oresoftware-next-loggers"]

[dependencies]
# Pinned by revision: a branch reference would let a fresh resolution pick up a
# later logger commit and change behaviour, the dependency graph, or the MSRV
# underneath consumers that explicitly enable `otel-warning`.
oresoftware-next-loggers = { git = "https://github.com/ores-otel/ores.otel.log", rev = "47cfa716ea453a85a17e5f7c2015edc404550afb", optional = true }
