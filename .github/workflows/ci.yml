name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install declared MSRV
        run: rustup toolchain install 1.78.0 --profile minimal && rustup default 1.78.0
      - name: Prove default graph builds on MSRV
        run: |
          rm -f Cargo.lock
          cargo check
          cargo test

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal -c rustfmt,clippy && rustup default 1.88.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Verify opt-in OTel warning feature
        run: |
          cargo clippy --locked --all-targets --features otel-warning -- -D warnings
          cargo test --locked --features otel-warning
